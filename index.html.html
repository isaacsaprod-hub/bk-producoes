<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BK Produções</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: cabeçalho com logo + abas; aba Busca = cartão de seleção + lista de campos; aba Tabela = planilha editável com coluna do título fixa. Cores vêm da logo (azul-marinho, ciano, amarelo, laranja, rosa, violeta). */
:root{
  --navy:#222b6e; --sky:#4fc3f7; --sun:#f8e74f; --orange:#f7a23a; --pink:#e8449b; --violet:#7a52e8; --green:#4caf6a;
  --bg:#f5f7fe; --surface:#ffffff; --soft:#eef1fc; --ink:#1d2468; --muted:#59608f; --line:#e0e4f6;
  --primary:#222b6e; --on-primary:#ffffff; --focus:#2a8fd6;
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101433; --surface:#181d4a; --soft:#212860; --ink:#eef0ff; --muted:#a3aadc; --line:#2a3174;
  --primary:#4fc3f7; --on-primary:#101433; --focus:#4fc3f7; --green:#7bd68f; --violet:#a58bff; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101433; --surface:#181d4a; --soft:#212860; --ink:#eef0ff; --muted:#a3aadc; --line:#2a3174;
  --primary:#4fc3f7; --on-primary:#101433; --focus:#4fc3f7; --green:#7bd68f; --violet:#a58bff; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";display:block;height:5px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  background:linear-gradient(90deg,var(--sky),var(--sun),var(--orange),var(--pink),var(--violet))}
.wrap{max-width:1180px;margin:0 auto}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
button,input,select,textarea{font:inherit;color:inherit}

header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:20px 8px}
.logo{width:56px;height:56px;border-radius:50%;flex:none;display:block}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1.1}
.brand span{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:999px}
nav button{border:0;background:transparent;padding:7px 16px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
nav button[aria-selected="true"]{background:var(--primary);color:var(--on-primary)}

h1{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,4vw,32px);letter-spacing:.02em;line-height:1.15;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:4px 0 0}
.view{padding-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}

/* Busca */
#v-busca .inner{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.pick{padding:22px;display:flex;flex-direction:column;gap:14px}
.pick-row{display:flex;gap:8px;flex-wrap:wrap}
.pick select{flex:1 1 260px;min-width:0}
select,input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
select{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700;font-size:14px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:#c0334f;border-color:currentColor}
.info{padding:6px 22px 14px}
.info h2{font-family:var(--font-display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px;font-weight:700}
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px}
.row{display:grid;grid-template-columns:minmax(110px,38%) minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.row dt{color:var(--muted);font-size:13px;font-weight:600}
.row dd{margin:0;overflow-wrap:anywhere}
.row.big dd{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.25}
.row.wide{grid-column:1/-1;grid-template-columns:minmax(110px,19%) minmax(0,1fr)}
.empty{color:var(--muted)}
a.lnk{color:var(--primary);font-weight:700;text-decoration:underline;text-underline-offset:3px;display:inline-flex;gap:4px;align-items:center}
a.lnk svg{flex:none}

.pill{display:inline-flex;align-items:center;gap:7px;padding:2px 11px 2px 9px;border-radius:999px;font-size:13px;font-weight:700;
  background:color-mix(in srgb,var(--c,var(--muted)) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--c,var(--muted)) 40%,var(--surface));white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.pill[data-s="finalizado"],.pill[data-s="Feita"],.pill[data-s="sim"]{--c:var(--green)}
.pill[data-s="mixando"]{--c:var(--sky)}
.pill[data-s="aguardando voz"]{--c:var(--pink)}
.pill[data-s="aguard... aprov"]{--c:var(--violet)}
.pill[data-s="pré produção"],.pill[data-s="aguardando produção"]{--c:var(--orange)}
.pill[data-s="não"]{--c:var(--muted)}
.hint{border-bottom:1px dashed var(--muted);cursor:help;font-weight:600}

/* Tabela */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input[type=text]{flex:1 1 220px}
.bar .count{color:var(--muted);font-size:13px;margin-left:auto}
.tablebox{overflow:auto;max-height:70vh;border-radius:16px}
table{border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:max-content;width:100%}
th{position:sticky;top:0;z-index:2;background:var(--soft);text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:3px 4px;border-bottom:1px solid var(--line);background:var(--surface);vertical-align:middle}
th:first-child,td:first-child{position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line)}
th:first-child{z-index:3}
td input[type=text],td select{width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;font-size:13.5px}
td input[type=text]:hover,td select:hover{border-color:var(--line)}
td input[type=text]:focus,td select:focus{border-color:var(--focus);background:var(--surface)}
td.c-titulo{min-width:230px}td.c-compositor{min-width:220px}td.c-obs{min-width:210px}td.c-master,td.c-audio{min-width:200px}
td.c-artista,td.c-feat,td.c-status,td.c-capa,td.c-clipe,td.c-tipo,td.c-projeto,td.c-cadastral,td.c-isrc{min-width:150px}
td.c-inicio,td.c-entrega,td.c-lancamento{min-width:118px}
td.c-lancada{text-align:center}
td input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);cursor:pointer}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12.5px;font-weight:700;white-space:nowrap}
.mini:hover{background:var(--soft)}
tr:hover td{background:color-mix(in srgb,var(--soft) 55%,var(--surface))}

/* tooltip + dialog + toast */
#tip{position:fixed;z-index:50;max-width:min(320px,calc(100vw - 24px));background:var(--navy);color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;white-space:pre-wrap;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:22px;width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(16,20,51,.55)}
dialog h3{font-family:var(--font-display);margin:0 0 12px;font-size:20px}
dialog label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 4px}
dialog input[type=text],dialog textarea{width:100%}
dialog textarea{min-height:130px;resize:vertical}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.actions .sp{margin-right:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25)}

@media (max-width:640px){
  .rows{grid-template-columns:minmax(0,1fr)}
  .row,.row.wide{grid-template-columns:minmax(96px,34%) minmax(0,1fr)}
  .info{padding-inline:16px}.pick{padding:16px}
  nav{width:100%}nav button{flex:1}
}
@media (prefers-reduced-motion:no-preference){.card{transition:box-shadow .2s}}
</style>

  </div>

<div id="tip" hidden></div>

<script>
const ORIGINAL = [];
const LS = 'bk-producoes-musicas-v1';
const ARTISTAS = ['Emily','Bunekão','Joowjow','Gil e Cris','Acacio','Rabisco e Borracha','Daniele'];
const FEATS = ['Emily','Bunekão','Joowjow','Gil e Cris','Acacio','Rabisco e Borracha','Daniele','Sem feat','Vanessa'];
const STATUS = ['pré produção','aguard... aprov','aguardando voz','mixando','finalizado'];
const PRODUCAO = ['aguardando produção','Feita'];
const FIELDS = [
  {k:'titulo',l:'Título da Música',t:'text',big:1},
  {k:'projeto',l:'projeto',t:'sel',o:['principal','projeto B']},
  {k:'artista',l:'Artista/Banda',t:'sel',o:ARTISTAS},
  {k:'feat',l:'Feat',t:'sel',o:FEATS},
  {k:'compositor',l:'compositor',t:'text'},
  {k:'inicio',l:'Data de Início',t:'date'},
  {k:'audio',l:'audio de referencia',t:'link',lk:'audioLink'},
  {k:'status',l:'Status de Produção',t:'sel',o:STATUS,pill:1},
  {k:'master',l:'Master',t:'link',lk:'masterLink'},
  {k:'ficha',l:'ficha tecnica',t:'ficha'},
  {k:'isrc',l:'ISRC',t:'text'},
  {k:'capa',l:'Capa/Arte',t:'sel',o:PRODUCAO,pill:1},
  {k:'clipe',l:'Clipe',t:'sel',o:PRODUCAO,pill:1},
  {k:'entrega',l:'Data de entrega',t:'date'},
  {k:'lancamento',l:'Data de Lançamento',t:'date'},
  {k:'cadastral',l:'Ficha Cadastral',t:'text'},
  {k:'tipo',l:'tipo de video',t:'sel',o:['coregrafia','animação','em avaliação']},
  {k:'lancada',l:'musica lançada',t:'check'},
  {k:'obs',l:'Observação',t:'text',wide:1}
];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let nextId = 1;
const clone = a => a.map(r => ({...r, _id: nextId++}));
let rows = [];
let selId = null;
try { const v = Number(sessionStorage.getItem(LS + '-sel')); if (rows.some(r => r._id === v)) selId = v; } catch(e) {}

function save(){ /* Edições são persistidas remotamente pelos eventos de alteração. */ }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }
const ext = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';

/* ---------- Abas ---------- */
function showTab(name){
  for (const n of ['busca','tabela']) {
    $('#t-' + n).setAttribute('aria-selected', n === name);
    $('#v-' + n).hidden = n !== name;
  }
  if (name === 'busca') renderSearch(); else renderTable();
}
$('#t-busca').onclick = () => showTab('busca');
$('#t-tabela').onclick = () => showTab('tabela');

/* ---------- Buscar Música ---------- */
function renderSelect(){
  const sel = $('#sel');
  sel.innerHTML = rows.filter(r => r.titulo).map(r => `<option value="${r._id}">${esc(r.titulo)}</option>`).join('');
  if (selId != null) sel.value = selId;
}
function valueHTML(f, r){
  const v = r[f.k];
  const empty = '<span class="empty">—</span>';
  if (f.t === 'check') return `<span class="pill" data-s="${v ? 'sim' : 'não'}">${v ? 'Sim' : 'Não'}</span>`;
  if (f.t === 'ficha') return `<span class="hint" tabindex="0" data-tip="${esc(r.fichaTxt || 'Sem ficha técnica preenchida.')}">${esc(v || 'passe o mouse para ver')}</span>`;
  if (f.t === 'link') { const u = safeUrl(r[f.lk]); if (!v && !u) return empty; return u ? `<a class="lnk" href="${esc(u)}" target="_blank" rel="noopener">${esc(v || u)}${ext}</a>` : esc(v); }
  if (v === '' || v == null) return empty;
  if (f.pill) return `<span class="pill" data-s="${esc(v)}">${esc(v)}</span>`;
  return esc(v);
}
function renderSearch(){
  renderSelect();
  const r = rows.find(x => x._id === selId);
  const info = $('#info');
  if (!r) { info.innerHTML = '<h2>Informações da música</h2><p class="empty">Selecione uma música.</p>'; return; }
  info.innerHTML = '<h2>Informações da música</h2><dl class="rows" style="margin:0">' + FIELDS.map(f =>
    `<div class="row${f.big ? ' big wide' : ''}${f.wide ? ' wide' : ''}"><dt>${f.l}</dt><dd>${valueHTML(f, r)}</dd></div>`).join('') + '</dl>';
}
function pick(id){ selId = id; try { sessionStorage.setItem(LS + '-sel', id); } catch(e) {} renderSearch(); }
$('#sel').onchange = e => pick(Number(e.target.value));
function step(d){ const l = rows.filter(r => r.titulo); const i = l.findIndex(r => r._id === selId); const n = l[(i + d + l.length) % l.length]; if (n) pick(n._id); }
$('#prev').onclick = () => step(-1);
$('#next').onclick = () => step(1);

/* ---------- Tabela editável ---------- */
function cellHTML(f, r){
  const v = r[f.k], id = r._id;
  if (f.t === 'check') return `<input type="checkbox" data-id="${id}" data-k="${f.k}" aria-label="${f.l}" ${v ? 'checked' : ''}>`;
  if (f.t === 'sel') {
    const o = f.o.includes(v) || v === '' ? f.o : [...f.o, v];
    return `<select data-id="${id}" data-k="${f.k}" aria-label="${f.l}"><option value=""></option>${o.map(x => `<option${x === v ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select>`;
  }
  if (f.t === 'ficha') return `<button class="mini" data-detail="${id}" data-tip="${esc(r.fichaTxt || 'Sem ficha técnica preenchida.')}">passe o mouse para ver</button>`;
  const ph = f.t === 'date' ? ' placeholder="dd/mm/aaaa"' : '';
  const link = f.t === 'link' && safeUrl(r[f.lk]) ? `<a class="lnk" href="${esc(r[f.lk])}" target="_blank" rel="noopener" aria-label="Abrir link">${ext}</a>` : '';
  const inp = `<input type="text" data-id="${id}" data-k="${f.k}" aria-label="${f.l}" value="${esc(v)}"${ph}>`;
  return link ? `<div style="display:flex;align-items:center;gap:4px">${inp}${link}</div>` : inp;
}
function filtered(){
  const q = $('#q').value.trim().toLowerCase(), st = $('#fstatus').value;
  return rows.filter(r => (!st || r.status === st) && (!q || ['titulo','artista','feat','compositor','obs','isrc'].some(k => String(r[k] || '').toLowerCase().includes(q))));
}
function renderTable(){
  const fs = $('#fstatus');
  if (!fs.options.length) fs.innerHTML = '<option value="">Todos os status</option>' + STATUS.map(s => `<option>${esc(s)}</option>`).join('');
  const list = filtered();
  $('#count').textContent = `${list.length} de ${rows.length} músicas`;
  $('#tbl').innerHTML = '<thead><tr>' + FIELDS.map(f => `<th>${f.l}</th>`).join('') + '<th></th></tr></thead><tbody>' +
    list.map(r => '<tr>' + FIELDS.map(f => `<td class="c-${f.k}">${cellHTML(f, r)}</td>`).join('') + `<td><button class="mini" data-detail="${r._id}">Detalhes</button></td></tr>`).join('') + '</tbody>';
}
function edit(e){
  const el = e.target, id = Number(el.dataset.id), k = el.dataset.k;
  if (!k) return;
  const r = rows.find(x => x._id === id); if (!r) return;
  r[k] = el.type === 'checkbox' ? el.checked : el.value;
  if (el.type !== 'text') persistRow(r);
  if (k === 'titulo') { renderSelect(); }
}
$('#tbl').addEventListener('input', e => { if (e.target.type === 'text') edit(e); });
$('#tbl').addEventListener('change', e => { if (e.target.type === 'text') { edit(e); const r=rows.find(x=>x._id===Number(e.target.dataset.id)); if(r) persistRow(r); } });
$('#tbl').addEventListener('change', e => { if (e.target.type !== 'text') edit(e); });
$('#q').oninput = renderTable;
$('#fstatus').onchange = renderTable;
$('#add').onclick = () => {
  const r = {_id: nextId--, titulo:'', projeto:'principal', artista:'Bunekão', feat:'Sem feat', compositor:'', inicio:'', audio:'', audioLink:'', status:'pré produção', master:'', masterLink:'', ficha:'passe o mouse para ver', fichaTxt:'nome oficial da musica\n\nDuração 00:00\n\nnome completo de quem participou\n\n', isrc:'', capa:'aguardando produção', clipe:'aguardando produção', entrega:'', lancamento:'', cadastral:'ficha da BR deluxe', tipo:'coregrafia', lancada:false, obs:''};
  rows.push(r); persistRow(r); $('#q').value = ''; $('#fstatus').value = ''; renderTable();
  const box = document.querySelector('.tablebox'); box.scrollTop = box.scrollHeight;
  const inp = document.querySelector(`input[data-id="${r._id}"][data-k="titulo"]`); if (inp) inp.focus();
};
$('#copy').onclick = async () => {
  const esc2 = v => String(v ?? '').replace(/\t/g, ' ').replace(/\r?\n/g, ' ');
  const tsv = [FIELDS.map(f => f.l).join('\t'), ...rows.map(r => FIELDS.map(f => f.t === 'check' ? (r[f.k] ? 'VERDADEIRO' : 'FALSO') : esc2(r[f.k])).join('\t'))].join('\n');
  try { await navigator.clipboard.writeText(tsv); toast('Tabela copiada. Cole no Excel ou Google Planilhas.'); }
  catch(e) { const ta = document.createElement('textarea'); ta.value = tsv; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch(_) {} ta.remove(); toast(ok ? 'Tabela copiada.' : 'Não foi possível copiar neste navegador.'); }
};
let resetArmed = false;
$('#reset').onclick = e => {
  if (!resetArmed) { resetArmed = true; e.target.textContent = 'Confirmar: apagar edições'; setTimeout(() => { resetArmed = false; e.target.textContent = 'Restaurar original'; }, 4000); return; }
  resetArmed = false; e.target.textContent = 'Restaurar original';
  toast('Restauração desativada no banco compartilhado.');
};

/* ---------- Detalhes (ficha técnica e links) ---------- */
const dlg = $('#dlg'); let dId = null, delArmed = false;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-detail]'); if (!b) return;
  const r = rows.find(x => x._id === Number(b.dataset.detail)); if (!r) return;
  dId = r._id; delArmed = false; $('#d-del').textContent = 'Excluir música';
  $('#dlg-title').textContent = r.titulo || 'Nova música';
  $('#d-ficha').value = r.fichaTxt || ''; $('#d-master').value = r.masterLink || ''; $('#d-audio').value = r.audioLink || '';
  hideTip(); dlg.showModal();
});
$('#d-cancel').onclick = () => dlg.close();
$('#d-save').onclick = () => {
  const r = rows.find(x => x._id === dId); if (r) { r.fichaTxt = $('#d-ficha').value; r.masterLink = $('#d-master').value.trim(); r.audioLink = $('#d-audio').value.trim(); persistRow(r); }
  dlg.close(); renderTable(); toast('Salvando...');
};
$('#d-del').onclick = e => {
  if (!delArmed) { delArmed = true; e.target.textContent = 'Confirmar exclusão'; return; }
  rows = rows.filter(x => x._id !== dId);
  if (!rows.some(x => x._id === selId)) selId = rows[0]?._id ?? null;
  deleteRow(dId); dlg.close(); renderTable(); toast('Excluindo...');
};

/* ---------- Tooltip da ficha técnica (passar o mouse / tocar) ---------- */
const tip = $('#tip');
function showTip(el){
  tip.textContent = el.dataset.tip; tip.hidden = false;
  const b = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
  let x = Math.min(Math.max(8, b.left), innerWidth - t.width - 8);
  let y = b.bottom + 8; if (y + t.height > innerHeight - 8) y = Math.max(8, b.top - t.height - 8);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip(){ tip.hidden = true; }
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) hideTip(); });
document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('focusout', hideTip);
document.addEventListener('click', e => { const el = e.target.closest('.hint[data-tip]'); if (el) showTip(el); else if (!e.target.closest('[data-tip]')) hideTip(); });

// Inicialização controlada pelo login; nenhum dado é exibido sem autorização.
</script>

<div id="bk-gate"><div class="card"><h1>BK Produções</h1><p class="lead">Acesso exclusivo à equipe autorizada</p><form id="bk-login"><label>E-mail<input id="bk-email" type="email" required autocomplete="email"></label><label>Senha<input id="bk-password" type="password" required autocomplete="current-password"></label><button class="btn primary" type="submit">Entrar</button></form><p id="bk-message" role="status" style="color:var(--muted)"></p><p class="lead">O administrador deve autorizar sua conta no Supabase.</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
const bk = window.supabase.createClient('https://fvxuelgtlulbsfgkdujv.supabase.co','sb_publishable_AdpcnI_ITAxh7a1bDiTcLg_LJE3oi0P');
let bkMember = null;
document.body.classList.add('bk-locked');
const msg = t => document.getElementById('bk-message').textContent = t;
function dataOnly(r){const o={...r};delete o._id;return o;}
async function persistRow(r){
  if(!bkMember) return;
  const id=r._id, data=dataOnly(r);
  let result;
  if(id>0) result=await bk.from('bk_songs').update({data,updated_at:new Date().toISOString()}).eq('id',id).select('id').single();
  else result=await bk.from('bk_songs').insert({data}).select('id').single();
  if(result.error){toast('Erro ao salvar: '+result.error.message);return;}
  if(id<=0){r._id=result.data.id;selId=r._id;renderTable();renderSelect();}
  toast('Alterações salvas online.');
}
async function deleteRow(id){
  const {error}=await bk.from('bk_songs').delete().eq('id',id);
  if(error){toast('Erro ao excluir: '+error.message);await loadSongs();}
  else toast('Música excluída online.');
}
async function loadSongs(){
  let all=[],from=0;
  while(true){
    const {data,error}=await bk.from('bk_songs').select('id,data').order('id').range(from,from+999);
    if(error){toast('Erro ao carregar: '+error.message);return;}
    all.push(...data);
    if(data.length<1000)break;
    from+=1000;
  }
  rows=all.map(x=>({...x.data,_id:x.id}));
  nextId=-1;
  if(!rows.some(x=>x._id===selId))selId=rows[0]?._id??null;
  showTab('busca');
}
async function enter(){
  const {data:{user}}=await bk.auth.getUser();
  if(!user){document.body.classList.add('bk-locked');document.getElementById('bk-gate').hidden=false;return;}
  const {data,error}=await bk.from('bk_members').select('role').eq('user_id',user.id).maybeSingle();
  if(error||!data){msg('Sua conta ainda não foi autorizada pelo administrador.');await bk.auth.signOut();return;}
  bkMember=data;
  document.body.classList.remove('bk-locked');
  document.getElementById('bk-gate').style.display='none';
  document.getElementById('bk-tools').style.display='flex';
  document.getElementById('bk-who').textContent=user.email+' · '+data.role;
  document.getElementById('bk-import').style.display=data.role==='admin'?'':'none';
  document.getElementById('reset').style.display='none';
  await loadSongs();
}
document.getElementById('bk-login').addEventListener('submit',async e=>{
  e.preventDefault();msg('Entrando...');
  const {error}=await bk.auth.signInWithPassword({email:document.getElementById('bk-email').value,password:document.getElementById('bk-password').value});
  if(error){msg('Não foi possível entrar: '+error.message);return;}
  await enter();
});
document.getElementById('bk-refresh').onclick=loadSongs;
document.getElementById('bk-logout').onclick=async()=>{await bk.auth.signOut();location.reload();};
document.getElementById('bk-import').onclick=()=>document.getElementById('bk-file').click();
document.getElementById('bk-file').onchange=async e=>{
  if(bkMember?.role!=='admin')return;
  const file=e.target.files[0];if(!file)return;
  let data;
  try{data=JSON.parse(await file.text());if(!Array.isArray(data))throw Error('JSON deve conter uma lista');}
  catch(err){toast('Arquivo inválido: '+err.message);return;}
  if(!confirm('Importar '+data.length+' músicas? Faça isso apenas uma vez para evitar duplicatas.'))return;
  for(let i=0;i<data.length;i+=100){
    const chunk=data.slice(i,i+100).map(dataOnly).map(data=>({data}));
    const {error}=await bk.from('bk_songs').insert(chunk);
    if(error){toast('Falha na importação: '+error.message);return;}
  }
  await loadSongs();toast('Importação concluída.');
};
enter();
</script>
